<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <span class="brand-mark">B</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <span></span><span></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      {% for s in site.data.sections %}
        {% assign href = '/' | append: s.slug | append: '/' %}
        <a href="{{ href | relative_url }}" style="--c: {{ s.color }}" {% if page.url == href or page.categories contains s.slug %}aria-current="page"{% endif %}>{{ s.short }}</a>
      {% endfor %}
      <span class="nav-sep" aria-hidden="true"></span>
      {% for l in site.data.navigation %}
        <a href="{{ l.url | relative_url }}" {% if page.url == l.url %}aria-current="page"{% endif %}>{{ l.title }}</a>
      {% endfor %}
      <a class="icon-btn" href="{{ '/search/' | relative_url }}" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </a>
      <button class="icon-btn theme-toggle" aria-label="Toggle dark mode">
        <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </div>
</header>
