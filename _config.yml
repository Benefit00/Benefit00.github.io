# ─────────────────────────────────────────────────────────────
#  Benefit — blog configuration
#  Most day-to-day settings live here. Restart `jekyll serve`
#  after editing this file (GitHub Pages rebuilds automatically).
# ─────────────────────────────────────────────────────────────

title: Benefit
tagline: "Notes on security, technology, money & life"
description: "Practical writing on cyber security, IT, finance and the lessons learned along the way."
url: "https://blog.blevin.cc"
baseurl: ""
lang: en-ZA
timezone: Africa/Johannesburg
permalink: /:title/          # keeps all existing post URLs unchanged

# Link back to the main company website (shown in header + footer)
company:
  name: "blevin.cc"
  url: "https://blevin.cc"

author:
  name: "Ben Levin"
  handle: "Benefit"
  avatar: "https://avatars.githubusercontent.com/u/8112969"
  bio: "Generalist aiming to specialise — but curiosity keeps pulling me to explore and understand new things."
  links:
    - { label: "GitHub",   url: "https://github.com/Benefit00" }
    - { label: "LinkedIn", url: "https://www.linkedin.com/in/ben--levin/" }
    - { label: "X",        url: "https://x.com/B3Liev" }
    - { label: "YouTube",  url: "https://www.youtube.com/@B3nefit" }

twitter:
  username: B3Liev
social:
  name: Ben Levin
  links:
    - https://github.com/Benefit00
    - https://www.linkedin.com/in/ben--levin/
    - https://x.com/B3Liev

# Plugins — all supported natively by GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

sass:
  style: compressed

# Every post gets these unless it says otherwise
defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
  - scope: { path: "" }
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
  - scripts/
  - vendor/
  - node_modules/
